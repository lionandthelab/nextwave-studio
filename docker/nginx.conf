# robot-sim-web — 정적 번들 서빙 설정 (프로덕션 이미지)
#
# 이 앱은 백엔드가 없다(PRD NFR-1). dist/를 그대로 서빙하기만 하면 되고,
# 라우팅은 경로가 아니라 ?scene= 쿼리 파라미터로 이뤄지므로 SPA 폴백은
# 잘못된 경로에 대한 안전망 역할만 한다.

server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # 압축 — 번들이 2.8MB(Rapier WASM base64 내장) 수준이라 효과가 크다
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain
                      text/css
                      text/xml
                      application/javascript
                      application/json
                      application/xml
                      application/wasm
                      image/svg+xml
                      model/gltf+json
                      model/gltf-binary;

    # Vite 해시 파일명(assets/index-XXXX.js)은 내용이 바뀌면 이름이 바뀐다 → 장기 캐시
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # URDF는 확장자가 표준 MIME 테이블에 없다 — XML로 명시한다
    # (urdf-loader는 텍스트로 읽지만, 프록시·브라우저 처리 일관성을 위해 지정)
    location ~* \.urdf$ {
        default_type application/xml;
        expires      1h;
    }

    # 3D 에셋(메시)
    location ~* \.(glb|gltf|stl|obj|mtl)$ {
        expires 1h;
    }

    # index.html은 캐시하지 않는다 — 배포 직후 새 번들 해시를 즉시 받도록
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
